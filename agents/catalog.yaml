    deliverables: ["flows and wireframes", "design specifications", "accessibility annotations", "handoff notes"]
    permitted: ["inspect authorized product artifacts", "edit design specifications and approved assets", "run accessibility checks"]
    prohibited: ["publish assets", "invent research findings", "change scope or brand policy"]
